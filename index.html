<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>My Attendance</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f3f5f9;color:#172033;margin:0}main{max-width:480px;margin:auto;padding:24px 18px}h1{font-size:26px}section{background:white;padding:20px;border-radius:18px;margin:15px 0;box-shadow:0 3px 15px #15233b0a}button,input{font:inherit;border-radius:10px;padding:12px;box-sizing:border-box}input{width:100%;border:1px solid #cbd5e1;margin:6px 0 12px}button{border:0;background:#172c55;color:white;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#e8eef7;color:#172c55}button.danger{background:#b42318} .actions{display:flex;gap:8px}.actions button{flex:1}.muted{color:#64748b;font-size:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.record{padding:12px 0;border-bottom:1px solid #edf0f5}.record:last-child{border:0}.hidden{display:none}.error{color:#b42318}.success{color:#147d52}#message{min-height:20px}</style></head><body><main><h1>My Attendance</h1><p class="muted">Personal check-in and check-out tracker · Riyadh time</p><section id="login"><h2>Sign in</h2><p class="muted">Enter your email to receive a secure sign-in link.</p><input type="email" id="email" placeholder="Email address" autocomplete="email"><button id="send">Send sign-in link</button></section><div id="app" class="hidden"><div class="row"><span id="who" class="muted"></span><button class="secondary" id="logout">Sign out</button></div><section><div class="row"><h2>Today</h2><span id="todayLabel" class="muted"></span></div><div class="row"><div><p class="muted">Check in</p><strong id="inDisplay">—</strong></div><div><p class="muted">Check out</p><strong id="outDisplay">—</strong></div></div><p id="duration" class="muted"></p><div class="actions"><button id="checkin">Check In</button><button id="checkout">Check Out</button></div><p class="muted">Taps capture your phone's current time. You can correct times below.</p></section><section><h2>Edit a day</h2><label>Date<input type="date" id="date"></label><label>Check in<input type="datetime-local" id="editin"></label><label>Check out<input type="datetime-local" id="editout"></label><div class="actions"><button id="save">Save changes</button><button class="secondary" id="clear">Clear day</button></div></section><section><div class="row"><h2>History</h2><button class="secondary" id="export">Export CSV</button></div><div id="history"></div></section></div><p id="message" role="status"></p></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://sxosctgqpdbznykjsnut.supabase.co','sb_publishable__cSOEiMskdQtoubT_LBMIA_lPXDqjwA');
const $=id=>document.getElementById(id);let records=[],user=null;
const dateStr=(d=new Date())=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
const fmt=v=>v?new Date(v).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Riyadh'}):'—';
const localInput=v=>{if(!v)return '';let d=new Date(v);let p=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d);return p.replace(' ','T')};
const toISO=v=>v?new Date(v+':00+03:00').toISOString():null;
const msg=(s,error=false)=>{$('message').textContent=s;$('message').className=error?'error':'success'};
const current=()=>records.find(r=>r.work_date===dateStr());
const diff=r=>r?.check_in&&r?.check_out?((new Date(r.check_out)-new Date(r.check_in))/3600000).toFixed(2)+' hours':'';
function render(){let r=current();$('todayLabel').textContent=dateStr();$('inDisplay').textContent=fmt(r?.check_in);$('outDisplay').textContent=fmt(r?.check_out);$('duration').textContent=diff(r);$('checkin').disabled=!!r?.check_in;$('checkout').disabled=!r?.check_in||!!r?.check_out;let sel=records.find(x=>x.work_date===$('date').value);$('editin').value=localInput(sel?.check_in);$('editout').value=localInput(sel?.check_out);$('history').replaceChildren();for(let x of records){let div=document.createElement('div');div.className='record';let a=document.createElement('div');a.className='row';let label=document.createElement('strong');label.textContent=x.work_date;let b=document.createElement('button');b.className='secondary';b.textContent='Edit';b.onclick=()=>{$('date').value=x.work_date;render();window.scrollTo({top:200,behavior:'smooth'})};a.append(label,b);let p=document.createElement('p');p.className='muted';p.textContent=`${fmt(x.check_in)} → ${fmt(x.check_out)} · ${diff(x)}`;div.append(a,p);$('history').append(div)}if(!records.length)$('history').textContent='No records yet.'}
async function refresh(){let {data,error}=await sb.from('attendance').select('*').order('work_date',{ascending:false}).limit(365);if(error)throw error;records=data||[];render()}
async function upsert(day,check_in,check_out){if(check_in&&check_out&&new Date(check_out)<new Date(check_in))throw Error('Check out must be after check in');let {error}=await sb.from('attendance').upsert({user_id:user.id,work_date:day,check_in,check_out},{onConflict:'user_id,work_date'});if(error)throw error;await refresh();msg('Saved to cloud')}
async function run(fn){try{msg('Saving...');await fn()}catch(e){msg(e.message||'Something went wrong',true)}}
$('send').onclick=()=>run(async()=>{let email=$('email').value.trim();if(!email)throw Error('Enter your email');let {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;msg('Check your email for the sign-in link')});
$('logout').onclick=()=>run(async()=>{await sb.auth.signOut();msg('Signed out')});
$('checkin').onclick=()=>run(async()=>{let r=current();await upsert(dateStr(),new Date().toISOString(),r?.check_out||null)});
$('checkout').onclick=()=>run(async()=>{let r=current();if(!r?.check_in)throw Error('Check in first');await upsert(dateStr(),r.check_in,new Date().toISOString())});
$('save').onclick=()=>run(async()=>{if(!$('date').value)throw Error('Select a date');await upsert($('date').value,toISO($('editin').value),toISO($('editout').value))});
$('clear').onclick=()=>run(async()=>{if(!confirm('Delete attendance for this day?'))return;let {error}=await sb.from('attendance').delete().eq('work_date',$('date').value);if(error)throw error;await refresh();msg('Day cleared')});
$('date').onchange=render;
$('export').onclick=()=>{let lines=['date,check_in,check_out,hours',...records.map(r=>[r.work_date,r.check_in||'',r.check_out||'',diff(r)].join(','))];let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'}));a.download='attendance.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
async function auth(session){user=session?.user||null;$('login').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);if(user){$('who').textContent=user.email;$('date').value=dateStr();await run(refresh)}}
sb.auth.onAuthStateChange((_event,session)=>{setTimeout(()=>auth(session),0)});let {data:{session}}=await sb.auth.getSession();await auth(session);
</script></body></html>
