<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142952"><meta name="apple-mobile-web-app-capable" content="yes"><title>My Attendance</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1b2b4c;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}main{width:100%;max-width:540px;margin:0 auto;padding:22px 16px calc(48px + env(safe-area-inset-bottom));overflow-x:hidden}h1{font-size:28px;margin:2px 0 5px}h2{font-size:20px;margin:0 0 18px}.muted{color:#73819a;font-size:14px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;color:#7a8ba5;text-transform:uppercase}.card{background:white;padding:20px;border-radius:24px;margin:18px 0;min-width:0;max-width:100%;box-shadow:0 4px 28px #1429520a}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}.row>*{min-width:0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.tile{background:#f4f7fb;border-radius:16px;padding:17px 14px}.tile strong{font-size:23px;display:block;margin:9px 0 0;font-variant-numeric:tabular-nums}.tile small{font-size:13px;color:#75849d}.actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;width:100%}.actions button{min-width:0;width:100%;white-space:normal;overflow-wrap:anywhere}.btn,button{font:inherit;cursor:pointer;border:0;border-radius:13px;padding:15px;background:#152c59;color:white;font-weight:650}.btn:disabled,button:disabled{opacity:.42;cursor:not-allowed}.secondary{background:#eaf0f9;color:#20365c}.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:white;padding:7px;border-radius:17px;margin:20px 0}.nav button{background:transparent;color:#7b87a0;padding:12px}.nav button.active{background:#eaf0f9;color:#142d60}input{display:block;width:100%;min-width:0;max-width:100%;font:inherit;font-size:16px;border-radius:12px;padding:12px;border:1px solid #cdd6e4;background:#f9fafc;color:#20304e;margin:7px 0 16px;min-height:52px;-webkit-appearance:none;appearance:none}input[type=date],input[type=datetime-local]{display:block;text-align:left;line-height:1.3;min-height:56px}input::-webkit-date-and-time-value{text-align:left;min-height:1em}input::-webkit-datetime-edit{min-width:0;padding:0}input::-webkit-calendar-picker-indicator{margin-left:4px;flex-shrink:0}label{display:block;font-size:14px;color:#5a6983}.record{padding:16px 0;border-top:1px solid #ebeff5}.record button{padding:9px 14px}.hidden{display:none!important}.status{border-radius:12px;padding:10px 13px;font-size:14px;margin:12px 0}.success{background:#e7f7ed;color:#187248}.error{background:#fff0f0;color:#b12222}.working{background:#eaf0fb;color:#264d85}#logout{padding:8px 11px;font-size:13px}.ghost{padding:10px 0;background:transparent;color:#304b7b}.empty{text-align:center;color:#8391a8;padding:32px 0}#historyRows .record:first-child{border-top:0}.total{font-size:32px;font-weight:700;letter-spacing:-.02em}
@media(max-width:370px){main{padding-left:12px;padding-right:12px}.card{padding:16px}.tile{padding:12px 10px}.tile strong{font-size:19px}button{padding:12px 8px;font-size:14px}}
</style></head><body><main><div class="row"><div><div class="eyebrow">PERSONAL TIME TRACKER</div><h1>My Attendance</h1></div><button class="secondary hidden" id="logout">Sign out</button></div><p class="muted" id="subtitle">Track your day with one tap.</p><div id="status" aria-live="polite" class="hidden"></div>
<section id="login" class="card"><h2>Welcome back</h2><p class="muted">Sign in with your email to keep your attendance saved in the cloud.</p><input id="email" type="email" autocomplete="email" placeholder="Your email"><button id="send" style="width:100%">Email me a sign-in link</button></section>
<div id="app" class="hidden"><nav class="nav"><button id="navHome" class="active">Home</button><button id="navHistory">History</button></nav>
<div id="homeView"><section class="card"><div class="row"><div><div class="eyebrow">TODAY</div><h2 id="todayText" style="margin:8px 0 0"></h2></div><span style="font-size:30px">◷</span></div><div class="pair"><div class="tile"><small>Check In</small><strong id="todayIn">—</strong></div><div class="tile"><small>Check Out</small><strong id="todayOut">—</strong></div></div><div class="row" style="margin-bottom:22px"><span class="muted">Total hours</span><span class="total" id="todayHours">—</span></div><div class="actions"><button id="checkin">Check In</button><button id="checkout" class="secondary">Check Out</button></div><p class="muted" style="text-align:center;margin-bottom:0">Times are captured from your phone automatically.</p></section><button class="ghost" id="editToday">Edit today's attendance →</button></div>
<div id="historyView" class="hidden"><section class="card"><div class="row"><h2>History</h2><button id="export" class="secondary" style="padding:10px 12px;font-size:13px">Export CSV</button></div><div id="historyRows"></div></section></div>
<div id="editView" class="hidden"><button id="back" class="ghost">← Back</button><section class="card"><h2>Edit attendance</h2><label>Date<input type="date" id="date"></label><label>Check In<input type="datetime-local" id="editin"></label><label>Check Out<input type="datetime-local" id="editout"></label><div class="actions"><button id="save">Save Changes</button><button id="clear" class="secondary">Delete Day</button></div></section></div></div>
</main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://sxosctgqpdbznykjsnut.supabase.co','sb_publishable__cSOEiMskdQtoubT_LBMIA_lPXDqjwA');
const $=id=>document.getElementById(id);let user=null,records=[],busy=false,view='home',lastDay='';
const zone='Asia/Riyadh';
const dateStr=(d=new Date())=>new Intl.DateTimeFormat('sv-SE',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
const formatTime=v=>v?new Date(v).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:zone}):'—';
const localInput=v=>v?new Intl.DateTimeFormat('sv-SE',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(v)).replace(' ','T'):'';
const toISO=v=>v?new Date(v+':00+03:00').toISOString():null;
const hours=r=>r?.check_in&&r?.check_out?(Date.parse(r.check_out)-Date.parse(r.check_in))/3600000:null;
const today=()=>records.find(r=>r.work_date===dateStr());
let statusTimeout;
function status(message,type='success'){clearTimeout(statusTimeout);$('status').textContent=message;$('status').className='status '+type;if(type==='success')statusTimeout=setTimeout(()=>{$('status').className='hidden'},3500)}
function showView(next){view=next;for(const v of ['home','history','edit'])$(v+'View').classList.toggle('hidden',next!==v);$('navHome').classList.toggle('active',next==='home');$('navHistory').classList.toggle('active',next==='history');}
function render(){const r=today();$('todayText').textContent=new Date().toLocaleDateString('en-US',{timeZone:zone,weekday:'long',month:'short',day:'numeric'});$('todayIn').textContent=formatTime(r?.check_in);$('todayOut').textContent=formatTime(r?.check_out);$('todayHours').textContent=hours(r)===null?'—':hours(r).toFixed(2)+'h';$('checkin').disabled=busy||!!r?.check_in;$('checkout').disabled=busy||!r?.check_in||!!r?.check_out;const holder=$('historyRows');holder.replaceChildren();if(records.length===0){const empty=document.createElement('div');empty.className='empty';empty.textContent='No attendance records yet';holder.append(empty)}for(const x of records){const wrap=document.createElement('div');wrap.className='record';const top=document.createElement('div');top.className='row';const date=document.createElement('strong');date.textContent=x.work_date;const edit=document.createElement('button');edit.className='secondary';edit.textContent='Edit';edit.onclick=()=>openEditor(x.work_date);top.append(date,edit);const times=document.createElement('div');times.className='muted';times.style.marginTop='9px';times.textContent=formatTime(x.check_in)+' → '+formatTime(x.check_out)+(hours(x)===null?'':' · '+hours(x).toFixed(2)+' hours');wrap.append(top,times);holder.append(wrap)}}
function openEditor(day){$('date').value=day;populateEdit();showView('edit');window.scrollTo({top:0,behavior:'smooth'})}
function populateEdit(){const x=records.find(r=>r.work_date===$('date').value);$('editin').value=localInput(x?.check_in);$('editout').value=localInput(x?.check_out)}
async function refresh(){const {data,error}=await sb.from('attendance').select('*').order('work_date',{ascending:false}).limit(1000);if(error)throw error;records=data||[];render()}
async function save(day,check_in,check_out){if(check_in&&check_out&&Date.parse(check_out)<Date.parse(check_in))throw Error('Check Out cannot be before Check In');const {error}=await sb.from('attendance').upsert({user_id:user.id,work_date:day,check_in,check_out},{onConflict:'user_id,work_date'});if(error)throw error;await refresh()}
async function run(fn,success='Saved to cloud'){if(busy)return;busy=true;status('Saving…','working');render();try{await Promise.race([fn(),new Promise((_,reject)=>setTimeout(()=>reject(Error('Save is taking too long. Check your connection, then refresh to verify your record before trying again.')),15000))]);status(success)}catch(e){status(e.message||'Unable to save. Try again.','error')}finally{busy=false;render()}}
$('navHome').onclick=()=>showView('home');$('navHistory').onclick=()=>showView('history');$('back').onclick=()=>showView('history');$('editToday').onclick=()=>openEditor(dateStr());$('date').onchange=populateEdit;
$('send').onclick=()=>run(async()=>{const email=$('email').value.trim();if(!email)throw Error('Enter your email');const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error},'Check your email for your sign-in link');
$('logout').onclick=()=>run(async()=>{const {error}=await sb.auth.signOut();if(error)throw error},'Signed out');
$('checkin').onclick=()=>run(async()=>{if(today()?.check_in)throw Error('Already checked in today');await save(dateStr(),new Date().toISOString(),null)},'Check In saved to cloud');
$('checkout').onclick=()=>run(async()=>{const r=today();if(!r?.check_in)throw Error('Check in first');await save(dateStr(),r.check_in,new Date().toISOString())},'Check Out saved to cloud');
$('save').onclick=()=>run(async()=>{if(!$('date').value)throw Error('Choose a date');await save($('date').value,toISO($('editin').value),toISO($('editout').value));showView('history')},'Changes saved to cloud');
$('clear').onclick=()=>{if(!confirm('Delete this day permanently?'))return;run(async()=>{const {error}=await sb.from('attendance').delete().eq('work_date',$('date').value);if(error)throw error;await refresh();showView('history')},'Day deleted')};
$('export').onclick=()=>{const rows=['date,check_in,check_out,hours',...records.map(r=>[r.work_date,r.check_in||'',r.check_out||'',hours(r)===null?'':hours(r).toFixed(2)].join(','))];const blob=new Blob([rows.join('\n')],{type:'text/csv'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='attendance.csv';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)};
async function auth(session){const newUser=session?.user||null;if(user?.id===newUser?.id&&records.length)return;user=newUser;records=[];$('login').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);$('logout').classList.toggle('hidden',!user);if(user){$('subtitle').textContent='Your attendance, all in one place.';showView('home');try{await refresh()}catch(e){status('Could not load attendance: '+e.message,'error')}}else{$('subtitle').textContent='Track your day with one tap.'}}
sb.auth.onAuthStateChange((_event,session)=>{setTimeout(()=>auth(session),0)});const {data:{session}}=await sb.auth.getSession();await auth(session);
setInterval(()=>{if(user&&dateStr()!==lastDay){lastDay=dateStr();render()}},60000);
</script></body></html>
